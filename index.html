<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://esm.sh; connect-src 'self' https://api.anthropic.com https://esm.sh; style-src 'self'; img-src 'self' data:">
  <meta name="description" content="A typing test that finds your weak keys and words and trains them.">
  <title>Weak Keys</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2310131a'/%3E%3Crect x='14' y='7' width='4' height='18' rx='2' fill='%235eead4'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/style.css">
  <link rel="modulepreload" href="js/words/english.js">
  <link rel="modulepreload" href="js/generator.js">
  <link rel="modulepreload" href="js/engine.js">
  <link rel="modulepreload" href="js/scoring.js">
  <link rel="modulepreload" href="js/summary.js">
  <link rel="modulepreload" href="js/keys.js">
  <link rel="modulepreload" href="js/store.js">
  <link rel="modulepreload" href="js/analysis.js">
  <link rel="modulepreload" href="js/weak.js">
  <link rel="modulepreload" href="js/view-test.js">
  <script type="module" src="js/main.js"></script>
</head>
<body>
  <header class="top">
    <a class="brand" href="./" aria-label="Weak Keys, home"><span class="brand-mark" aria-hidden="true"></span>weak<b>keys</b></a>
    <button id="open-settings" class="quiet" type="button">settings</button>
  </header>

  <main>
    <section id="test-screen" aria-label="Typing test">
      <div class="modebar" role="toolbar" aria-label="Test options">
        <button id="opt-punct" type="button" aria-pressed="false">punctuation</button>
        <span class="sep" aria-hidden="true"></span>
        <button type="button" data-seconds="15" aria-pressed="false" aria-label="15 seconds">15</button>
        <button type="button" data-seconds="30" aria-pressed="false" aria-label="30 seconds">30</button>
        <button type="button" data-seconds="60" aria-pressed="false" aria-label="60 seconds">60</button>
        <button type="button" data-seconds="120" aria-pressed="false" aria-label="120 seconds">120</button>
        <input id="opt-custom" type="number" min="5" max="3600" inputmode="numeric" placeholder="custom" aria-label="Custom time in seconds">
        <span class="sep" aria-hidden="true"></span>
        <select id="opt-list" aria-label="Word list">
          <option value="english">200 words</option>
          <option value="english_1k">1k words</option>
          <option value="english_5k">5k words</option>
        </select>
        <span class="sep" aria-hidden="true"></span>
        <button id="opt-weak" type="button" aria-pressed="false">weak points</button>
      </div>

      <p id="notice" class="notice" role="status"></p>
      <div id="timer" class="timer" aria-label="Seconds left">&nbsp;</div>
      <div id="words" class="words idle" aria-label="Words to type. Start typing to begin.">
        <div class="words-inner"><span class="caret" aria-hidden="true"></span></div>
      </div>
      <p class="hint"><kbd>tab</kbd> restart</p>
    </section>

    <section id="results-screen" aria-label="Results" hidden></section>
  </main>
</body>
</html>
